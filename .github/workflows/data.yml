name: Обновление статистики

on:
  schedule:
    - cron: "37 */8 * * *"   # каждые 8 часов
  workflow_dispatch:          # кнопка «Run workflow» во вкладке Actions

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Не дать базе Supabase уснуть
        # бесплатный проект Supabase ставится на паузу после недели без запросов;
        # этот запрос раз в 8 часов держит его активным (ключ публичный — он и так есть на сайте)
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w "Supabase ответил %{http_code}\n" \
            "https://xxcamhzdaibiotzgcobn.supabase.co/rest/v1/drafts?select=id&limit=1" \
            -H "apikey: sb_publishable_SiER2K_KtPdlCoD8h0V2Dw_49iKhqT6"
      - name: Собрать data.json
        run: node scripts/build-data.mjs
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - name: Опубликовать в ветку data
        # ветка data всегда из одного коммита — история не растёт
        run: |
          mkdir out && mv data.json out/ && cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -qm "Статистика $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
